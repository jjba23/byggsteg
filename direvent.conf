debug 0;
foreground true;

# SCM watchers
watcher {
    path .;
    event (create, write, delete);
    file (
      "/.*\\.scm/i",
      "/.*\\.js/i",
      "/.*\\.conf/i",
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "maak server";
    timeout 15;    
}

watcher {
    path ./lib/byggsteg;
    event (create, write, delete);
    file (
      "/.*\\.scm/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../ && maak server";
    timeout 15;
}

