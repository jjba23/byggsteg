steps:
  update-jointhefreeworld:
    image: debian
    when:
      - event: [push]
        branch: [trunk]        
    secrets: [BYGGSTEG_KEY]    
    commands: |
      apt update
      apt install -y curl
      curl 'https://byggsteg.jointhefreeworld.org/api/v1/jobs/manage/submit' \
        -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode 'username=Joe' \
        --data-urlencode "password=$BYGGSTEG_KEY" \
        --data-urlencode 'job-code=(lambda() `((project . "byggsteg")(branch-name . "trunk")(task . "byggsteg-version")(clone-url . "https://codeberg.org/jjba23/byggsteg")))'

