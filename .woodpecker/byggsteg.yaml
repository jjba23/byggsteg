variables:
  - &byggsteg_url 'https://byggsteg.jointhefreeworld.org'
  - &byggsteg_submit_job_image 'docker.io/jjba23/byggsteg-woodpecker-submit-job:v0.1.14'
  - &byggsteg_poll_job_image 'docker.io/jjba23/byggsteg-woodpecker-poll-job:v0.1.14'
  - &byggsteg_get_token_image 'docker.io/jjba23/byggsteg-woodpecker-get-token:v0.1.14'
  
steps:
  get-byggsteg-token-jointhefreeworld:
    image: *byggsteg_get_token_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:
      BYGGSTEG_EMAIL:
        from_secret: "BYGGSTEG_EMAIL"
      BYGGSTEG_PASSWORD:
        from_secret: "BYGGSTEG_PASSWORD"
      BYGGSTEG_URL: *byggsteg_url        
        
  submit-byggsteg-job-jointhefreeworld:
    image: *byggsteg_submit_job_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:
      BYGGSTEG_URL: *byggsteg_url
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . ("byggsteg-version" "pull-and-deploy"))
            (daemon-name . "byggsteg-daemon")
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")            
            (clone-url . "%%CI_REPO_CLONE_URL%%")))
            
  poll-byggsteg-job-jointhefreeworld:
    image: *byggsteg_poll_job_image
    when:
      - event: [ "push" ]
        branch: [ "trunk" ]
    settings:     
      BYGGSTEG_URL: *byggsteg_url
