variables:
  - &byggsteg_image "docker.io/jjba23/byggsteg-woodpecker:v0.3.0"
  - &jointhefreeworld_byggsteg_url "https://byggsteg.jointhefreeworld.org"
  - &main_branch "trunk"

clone:
  - name: "⬇️ Clone Git repository"
    image: woodpeckerci/plugin-git
    settings:
      depth: 1

steps:
  get-byggsteg-token:
    name: "🔒 Get token @ Byggsteg"
    image: *byggsteg_image
    commands:
      - /bin/byggsteg-woodpecker get-token
    when:
      - event: [push]
        branch: [*main_branch]
    settings:
      BYGGSTEG_EMAIL:
        from_secret: BYGGSTEG_EMAIL
      BYGGSTEG_PASSWORD:
        from_secret: BYGGSTEG_PASSWORD
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url

  submit-byggsteg-job:
    name: "💼 Submit job @ Byggsteg"
    image: *byggsteg_image
    commands:
      - /bin/byggsteg-woodpecker submit-job
    when:
      - event: [push]
        branch: [*main_branch]
    settings:
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url
      BYGGSTEG_JOB_CODE: |
        (lambda()
          `((task . ("maak-test" "byggsteg-version" "maak-deploy"))
            (daemon-name . "byggsteg-daemon")
            (project . "%%CI_REPO_NAME%%")
            (branch-name . "%%CI_COMMIT_BRANCH%%")
            (clone-url . "%%CI_REPO_CLONE_URL%%")))

  poll-byggsteg-job:
    name: "🔄 Poll job status @ Byggsteg"
    image: *byggsteg_image
    commands:
      - /bin/byggsteg-woodpecker poll-job
    when:
      - event: [push]
        branch: [*main_branch]
    settings:
      BYGGSTEG_URL: *jointhefreeworld_byggsteg_url
