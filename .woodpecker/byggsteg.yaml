steps:
  byggsteg-trigger-jointhefreeworld:
    image: curlimages/curl
    when:
      - event: [push]
        branch: [trunk]
    environment:
      BYGGSTEG_KEY:
        from_secret: BYGGSTEG_KEY
      BYGGSTEG_USERNAME: "Joe"
      JOB_CODE: |
        (lambda()
        `((project . "byggsteg")
          (branch-name . "trunk")
          (task . "byggsteg-version")
          (daemon-name . "byggsteg-daemon")
          (clone-url . "https://codeberg.org/jjba23/byggsteg")))
    commands: |
      apt-get update
      apt-get install -y curl
      curl 'https://byggsteg.jointhefreeworld.org/api/v1/jobs/manage/submit' \
        -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
        --data-urlencode "username=$BYGGSTEG_USERNAME" \
        --data-urlencode "password=$BYGGSTEG_KEY" \
        --data-urlencode "job-code=$JOB_CODE"

