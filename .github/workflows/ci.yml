name: CI

on:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  byggsteg:
    name: 🧱 Byggsteg
    uses: jjba23/byggsteg-github/.github/workflows/byggsteg.yml@trunk
    with:
      tasks: maak-test byggsteg-version maak-deploy
      daemon-name: byggsteg-daemon
      timeout-minutes: 60
    secrets: inherit
